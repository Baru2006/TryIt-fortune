<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tarot Reading — TryIt Hub</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="tarot.css" />
</head>
<body class="tarot-dark">

  <!-- 🎵 AUDIO -->
  <audio id="bgMusic" loop><source src="assets/audio/bg-music.mp3" type="audio/mpeg"></audio>
  <audio id="sfxClick"><source src="assets/audio/click.mp3" type="audio/mpeg"></audio>
  <audio id="sfxShuffle"><source src="assets/audio/shuffle.mp3" type="audio/mpeg"></audio>
  <audio id="sfxReveal"><source src="assets/audio/reveal.mp3" type="audio/mpeg"></audio>

  <!-- SCREEN 1: LOADING SCREEN (Progress Bar) -->
  <section class="tarot-screen active" id="screen-loading">
    <div class="loading-bg" style="background-image: url('assets/bg-loading.png');"></div>
    <div class="loading-content">
      <div class="loading-text">လုပ်ဆောင်နေသည်...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: MAIN MENU -->
  <section class="tarot-screen" id="screen-start">
    <div class="bg-home" style="background-image: url('assets/bg-home.png');"></div>
    
    <div class="menu-container">
      <img src="assets/title.png" alt="Tarot" class="main-title" />
      
      <div class="menu-card">
        <button class="menu-btn" onclick="startGame()">တာရော့ ကြည့်မယ်</button>
        <button class="menu-btn" onclick="openSettings()">ဝက်တင်များ</button>
        <button class="menu-btn" onclick="openAbout()">အက်ပံ့အကြောင်း</button>
        <button class="menu-btn" onclick="leaveApp()">ထွက်မယ်</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 3: INTRO -->
  <section class="tarot-screen" id="screen-intro">
    <div class="bg-home" style="background-image: url('assets/bg-home.png');"></div>
    <div class="character-img"></div>
    <div class="dialogue-box">
      <div class="dialogue-text">
        <p>"မင်္ဂလာပါ... ဘာအတွက် ဟောစာတမ်း လိုချင်တာလဲ...?"</p>
      </div>
      <div class="choice-buttons">
        <button class="tarot-btn" onclick="startReading(1)">
          <span>ဒီနေ့ လိုအပ်နေတဲ့အရာ</span><small>(၁ ကဒ်)</small>
        </button>
        <button class="tarot-btn" onclick="startReading(3)">
          <span>အတိတ်၊ ပစ္စုပ္ပန်၊ အနာဂတ်</span><small>(၃ ကဒ်)</small>
        </button>
      </div>
    </div>
  </section>

  <!-- SCREEN 4: PICK CARDS (စားပွဲပေါ်မှာ ရွေးမယ်) -->
  <section class="tarot-screen" id="screen-pick">
    <div class="pick-bg" style="background-image: url('assets/floor.png');"></div>
    
    <div class="table-wrap">
      <img src="assets/tarot-table.png" alt="Table" class="tarot-table" />
      
      <div class="pick-header">
        <h2 id="pick-instruction">ကဒ်ရွေးချယ်ပါ</h2>
      </div>
      
      <!-- စားပွဲပေါ်က ကဒ်များ -->
      <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- အောက်ခြေက လက်ပုံ -->
    <img src="assets/hands.png" alt="Hands" class="hands-img" />
  </section>

  <!-- SCREEN 5: RESULT -->
  <section class="tarot-screen" id="screen-result">
    <div class="result-container" id="captureArea">
      <div class="revealed-cards" id="revealedCards"></div>
      <div class="fortune-text" id="fortuneText"></div>
    </div>
    
    <div class="result-actions">
      <button class="action-btn" onclick="saveReading()">Save</button>
      <button class="action-btn" onclick="restartApp()">Again</button>
      <button class="action-btn" onclick="leaveApp()">Leave</button>
    </div>
  </section>

  <!-- SCREEN 6: SETTINGS -->
  <section class="tarot-screen" id="screen-settings">
    <div class="info-card">
      <h2>ဝက်တင်များ</h2>
      <div class="setting-row">
        <span>🎵 နောက်ခံ တီးလုံး</span>
        <button class="toggle-btn" id="musicToggle" onclick="toggleMusic()">ON</button>
      </div>
      <button class="tarot-btn" style="margin-top: 20px;" onclick="backToMenu()">ပင်မစာမျက်နှာသို့</button>
    </div>
  </section>

  <!-- SCREEN 7: ABOUT -->
  <section class="tarot-screen" id="screen-about">
    <div class="info-card">
      <h2>TryIt Hub Tarot</h2>
      <p class="version">Version 1.0.0</p>
      <p style="margin-bottom: 20px;">မြန်မာကောင်မလေးနဲ့အတူ သင့်အတွက် ဟောစာတမ်းဖတ်ပေးမယ့် ဂိမ်းလေးပါ။</p>
      <button class="tarot-btn" onclick="backToMenu()">ပင်မစာမျက်နှာသို့</button>
    </div>
  </section>

  <script src="tarot-data.js"></script>
  <script src="tarot.js"></script>
</body>
</html>
