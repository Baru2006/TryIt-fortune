<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tarot Reading — TryIt Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="tarot.css" />
</head>
<body class="tarot-dark">

  <!-- SCREEN 1: LOADING -->
  <section class="tarot-screen active" id="screen-loading">
    <div class="loading-spinner"></div>
    <h2>အိမ်ထဲကို ဝင်ရောက်နေသည်...</h2>
    <p>ခဏစောင့်ပါ</p>
  </section>

  <!-- SCREEN 2: INTRO & CHOICE -->
  <section class="tarot-screen" id="screen-intro">
    <div class="bg-room"></div>
    <div class="character-img" id="character"></div>
    
    <div class="dialogue-box">
      <div class="dialogue-text">
        <p id="char-speech">"ဘာအတွက် ဟောစာတမ်း လိုချင်တာလဲ...?"</p>
      </div>
      
      <div class="choice-buttons">
        <button class="tarot-btn" onclick="startReading(1)">
          <span>ဒီနေ့ လိုအပ်နေတဲ့အရာ</span>
          <small>(၁ ကဒ်)</small>
        </button>
        <button class="tarot-btn" onclick="startReading(3)">
          <span>အတိတ်၊ ပစ္စုပ္ပန်၊ အနာဂတ်</span>
          <small>(၃ ကဒ်)</small>
        </button>
      </div>
    </div>
  </section>

  <!-- SCREEN 3: SHUFFLE & PICK -->
  <section class="tarot-screen" id="screen-pick">
    <div class="bg-room"></div>
    <div class="character-img" id="character-pick"></div>
    
    <div class="pick-header">
      <h2 id="pick-instruction">၁ ကဒ် ရွေးချယ်ပါ</h2>
    </div>

    <!-- ကဒ် ၁၀ ကဒ် မှောက်ထားမည့်နေရာ -->
    <div class="cards-grid" id="cardsGrid">
      <!-- JS မှ ကဒ်များ ထည့်ပေးမည် -->
    </div>
  </section>

  <!-- SCREEN 4: RESULT -->
  <section class="tarot-screen" id="screen-result">
    <div class="result-container">
      <h2>ဟောစာတမ်း</h2>
      
      <div class="revealed-cards" id="revealedCards">
        <!-- ရွေးထားသော ကဒ်များ ပေါ်လာမည် -->
      </div>

      <div class="fortune-text" id="fortuneText">
        <!-- ဟောစာတမ်း စာသား -->
      </div>

      <div class="action-buttons">
        <button class="icon-btn" onclick="saveReading()">💾 Save</button>
        <button class="icon-btn" onclick="shareApp()">📤 Share</button>
      </div>

      <button class="tarot-btn primary-btn" onclick="showOutro()">Next ➔</button>
    </div>
  </section>

  <!-- SCREEN 5: OUTRO -->
  <section class="tarot-screen" id="screen-outro">
    <div class="bg-room"></div>
    <div class="character-img" id="character-outro"></div>
    
    <div class="dialogue-box">
      <div class="dialogue-text">
        <p>"ကံကောင်းပါစေ... နှုတ်ဆက်ပါတယ်။"</p>
      </div>
    </div>
  </section>

  <!-- SCREEN 6: APP INFO -->
  <section class="tarot-screen" id="screen-info">
    <div class="info-card">
      <img src="assets/logo.png" alt="TryIt Hub" class="info-logo" />
      <h2>TryIt Hub Tarot</h2>
      <p>Mystic Reading Experience</p>
      <p class="version">Version 1.0.0</p>
      
      <div class="action-buttons-vertical">
        <button class="tarot-btn" onclick="leaveApp()">Leave (Home)</button>
        <button class="tarot-btn primary-btn" onclick="restartApp()">Again (ပြန်စမယ်)</button>
      </div>
    </div>
  </section>

  <script src="tarot-data.js"></script>
<script src="tarot.js"></script>
</body>
</html>
