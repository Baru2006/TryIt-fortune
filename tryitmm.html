<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our App & Games — TryIt Hub</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light">

  <div class="app">

    <!-- ============ HEADER ============ -->
    <header class="app-header">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="TryIt Hub" draggable="false" />
      </div>
      <div class="header-info">
        <h1>TryIt Hub</h1>
        <p>Our App & Games</p>
      </div>
    </header>

    <!-- ============ SOCIAL BAR ============ -->
    <div class="social-bar">
      <div class="social-title">ငါတို့ Social မီဒီယာ</div>
      <div class="social-actions">
        <a href="https://tiktok.com/@yourchannel" target="_blank" class="social-btn">
          <svg viewBox="0 0 24 24" fill="none"><path d="M14 4v10.5a4.5 4.5 0 1 1-4.5-4.5M14 4c0 2.5 1.5 4.5 4 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>TikTok</span>
        </a>
        <a href="https://t.me/yourchannel" target="_blank" class="social-btn">
          <svg viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Telegram</span>
        </a>
        <button class="watch-ad-btn" id="watchAdBtn">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="3" y="6" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Watch AD</span>
        </button>
      </div>
    </div>

    <!-- ============ PAGE HEAD ============ -->
    <div class="page-head">
      <h2>Our App & Games</h2>
      <p>ကျွန်တော်တို့ရဲ့ App & Game များ</p>
      <div class="page-head-count">စုစုပေါင်း 2</div>
    </div>

    <!-- ============ APP LIST ============ -->
    <section class="list-cards" id="ourAppList">
      
      <!-- Card 1: Tarot (Active) -->
      <div class="list-card">
        <div class="list-card-icon">
          <img src="assets/apps/tarot.png" alt="Tarot" draggable="false" />
        </div>
        <div class="list-card-body">
          <div class="list-card-title">
            Tarot 
            <span class="online-badge">Online</span>
          </div>
          <div class="list-card-tags">
            <span class="tag">Mystic</span>
            <span class="tag">Reading</span>
          </div>
          <div class="list-card-dev">TryIt Studio</div>
          <div class="list-card-desc">တာရော့ကဒ်ဖြင့် ဟောစာတမ်းဖတ်ခြင်း</div>
          
          <div class="list-card-footer">
            <div class="list-card-size">Category - Game</div>
            <a href="tarot.html" class="list-card-btn" style="text-decoration: none;">အသုံးပြုမယ်</a>
          </div>
        </div>
      </div>

      <!-- Card 2: Coming Soon -->
      <div class="list-card coming-soon-card">
        <div class="list-card-icon placeholder-icon">
          <!-- Empty -->
        </div>
        <div class="list-card-body coming-soon-body">
          <h3>Coming Soon</h3>
          <p>မကြာမီ ထွက်ရှိပါမည်</p>
        </div>
      </div>

    </section>

    <!-- ============ BACK HOME ============ -->
    <div class="back-home-wrap">
      <a href="index.html" class="back-home-btn">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11l9-8 9 8M5 10v10h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Back Home</span>
      </a>
    </div>

    <footer class="app-footer">
      <p>© 2026 TryIt Hub</p>
    </footer>

  </div>

  <script src="protect.js"></script>
  <script>
    // Telegram WebApp ready
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Watch AD Logic (Adsgram)
    const ADSGRAM_BLOCK_ID = "54078"; // သင့် Block ID
    let adController = null;

    document.getElementById('watchAdBtn').addEventListener('click', async () => {
      try {
        if (!adController && window.Adsgram) {
          adController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        }
        if (adController) {
          const btn = document.getElementById('watchAdBtn');
          const originalText = btn.innerHTML;
          btn.innerHTML = 'Loading Ad...';
          
          await adController.show();
          
          btn.innerHTML = originalText;
          alert("ကြော်ငြာကြည့်ပြီးပါပြီ။ ကျေးဇူးတင်ပါတယ်!");
        }
      } catch (err) {
        console.log('Ad error/skipped:', err);
        alert("ကြော်ငြာ ကြည့်ခြင်း မအောင်မြင်ပါ။");
      }
    });
  </script>
</body>
</html>
