<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a15" />
  <title>TryIt Hub</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app">

    <!-- ============ HEADER ============ -->
    <header class="app-header glass-card">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="TryIt Hub" />
      </div>
      <div class="header-info">
        <h1>TryIt Hub</h1>
        <p>This is a description of this Hub</p>
      </div>
    </header>

    <!-- ============ HERO BANNER ============ -->
    <section class="hero glass-card">
      <div class="hero-img-wrap">
        <img src="assets/hero.png" alt="Hero" class="hero-img" />
      </div>
      <div class="hero-body">
        <h2 class="hero-title">TryIt Hub</h2>
        <p class="hero-desc">Everything you need in one place</p>
        <button class="hero-btn" onclick="goToPage('pages/fortune.html')">
          <span class="btn-icon" data-icon="rocket"></span>
          <span>Explore Now</span>
        </button>
      </div>
    </section>

    <!-- ============ SECTION 1: TOOLS ============ -->
    <section class="section">
      <div class="section-head">
        <h3>Online Useful Tools</h3>
        <button class="see-more" onclick="goToPage('pages/tools.html')">
          See more
          <span class="see-more-arrow" data-icon="arrowRight"></span>
        </button>
      </div>
      <div class="scroll-row" id="toolsGrid"></div>
    </section>

    <!-- ============ SECTION 2: POPULAR APPS ============ -->
    <section class="section">
      <div class="section-head">
        <h3>Popular Apps</h3>
        <button class="see-more" onclick="goToPage('pages/apps.html')">
          See more
          <span class="see-more-arrow" data-icon="arrowRight"></span>
        </button>
      </div>
      <div class="scroll-row" id="appsGrid"></div>
    </section>

    <!-- ============ SECTION 3: POPULAR GAMES ============ -->
    <section class="section">
      <div class="section-head">
        <h3>Popular Games</h3>
        <button class="see-more" onclick="goToPage('pages/games.html')">
          See more
          <span class="see-more-arrow" data-icon="arrowRight"></span>
        </button>
      </div>
      <div class="scroll-row" id="gamesGrid"></div>
    </section>

    <!-- ============ SECTION 4: OUR ONLINE APP & GAME ============ -->
    <section class="section">
      <div class="section-head">
        <h3>Our Online App & Game</h3>
        <button class="see-more" onclick="goToPage('pages/our-apps.html')">
          See more
          <span class="see-more-arrow" data-icon="arrowRight"></span>
        </button>
      </div>
      <div class="scroll-row" id="ourAppsGrid"></div>
    </section>

    <!-- ============ FOOTER ============ -->
    <footer class="app-footer">
      <p>TryIt Hub · Made with 💜</p>
    </footer>

  </div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
