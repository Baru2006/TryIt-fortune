<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>TryIt Hub</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light">

  <div class="app">

    <!-- ============ HEADER ============ -->
    <header class="app-header">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="TryIt Hub" draggable="false" />
      </div>
      <div class="header-info">
        <h1>TryIt Hub</h1>
        <p>All in one place</p>
      </div>
    </header>

    <!-- ============ HERO ============ -->
    <section class="hero-card">
      <div class="hero-img-wrap">
        <img src="assets/hero.png" alt="Hero" draggable="false" />
      </div>
      <div class="hero-body">
        <h2>TryIt Hub</h2>
        <p>Apps, Games, Tools — တစ်နေရာတည်း</p>
      </div>
    </section>

    <!-- ============ MAIN CARDS 2x2 ============ -->
    <section class="main-grid">

      <a class="main-card" href="tryitmm.html">
        <div class="main-card-icon">
          <img src="assets/icons/our-apps.png" alt="" draggable="false" />
        </div>
        <h3>Our App & Games</h3>
        <p>ကျွန်တော်တို့ရဲ့ App & Game</p>
      </a>

      <a class="main-card" href="online-tools.html">
        <div class="main-card-icon">
          <img src="assets/icons/tools.png" alt="" draggable="false" />
        </div>
        <h3>Online Useful Tools</h3>
        <p>အသုံးဝင်တဲ့ ကိရိယာများ</p>
      </a>

      <a class="main-card" href="popgame.html">
        <div class="main-card-icon">
          <img src="assets/icons/games.png" alt="" draggable="false" />
        </div>
        <h3>Popular Games</h3>
        <p>လူကြိုက်များတဲ့ Game များ</p>
      </a>

      <a class="main-card" href="popapp.html">
        <div class="main-card-icon">
          <img src="assets/icons/apps.png" alt="" draggable="false" />
        </div>
        <h3>Popular Apps</h3>
        <p>လူကြိုက်များတဲ့ App များ</p>
      </a>

    </section>

    <!-- ============ FOOTER ============ -->
    <footer class="app-footer">
      <a href="https://t.me/yourchannel" target="_blank" class="contact-btn">
        📩 Contact Us
      </a>
      <p>© 2026 TryIt Hub</p>
    </footer>

  </div>

  <script src="protect.js"></script>
  <script src="script.js"></script>
</body>
</html>
